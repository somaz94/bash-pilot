version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/main.go
    binary: bash-pilot
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/somaz94/bash-pilot/cmd/cli.Version={{.Version}}
      - -X github.com/somaz94/bash-pilot/cmd/cli.GitCommit={{.Commit}}
      - -X github.com/somaz94/bash-pilot/cmd/cli.BuildDate={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  groups:
    - title: "Features"
      regexp: '^feat'
      order: 0
    - title: "Bug Fixes"
      regexp: '^fix'
      order: 1
    - title: "Performance"
      regexp: '^perf'
      order: 2
    - title: "Refactoring"
      regexp: '^refactor'
      order: 3
    - title: "Build"
      regexp: '^build'
      order: 4
    - title: "Other Changes"
      order: 999
  filters:
    exclude:
      - '^docs: update changelog'
      - '^docs: update CONTRIBUTORS'
      - '^Merge'
      - '^Auto commit'

release:
  github:
    owner: somaz94
    name: bash-pilot
  draft: false
  prerelease: auto

# Homebrew. A cask, not a formula: GoReleaser deprecated "brews" in v2.10 and
# documents removal in v2.16, while this pins no GoReleaser version.
#
# Linux keeps working — a cask whose only artifact is a binary installs there
# the same way, despite cask documentation being written for macOS.
#
# Releases before this one shipped a formula, and Homebrew treats the two as
# separate packages, so "brew upgrade" will not carry anyone across. The
# release notes have to tell them:
#   brew uninstall --formula bash-pilot
#   brew install --cask somaz94/tap/bash-pilot
# Installing the cask without removing the formula first leaves both in place
# and silently keeps running the old binary.
#
# The old bash-pilot.rb in the tap has to be deleted and a tap_migrations.json
# entry added AFTER the first cask release, never before — while the formula
# exists it shadows the cask, and deleting it early breaks installs in the gap.
homebrew_casks:
  - name: bash-pilot
    binaries:
      - bash-pilot
    directory: Casks
    repository:
      owner: somaz94
      name: homebrew-tap
    homepage: "https://github.com/somaz94/bash-pilot"
    description: "A powerful CLI toolkit for bash power users — SSH, Git, Env, Prompt"
    hooks:
      post:
        # Homebrew quarantines cask downloads, and this binary is not signed or
        # notarized, so macOS would refuse to run it without this.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/bash-pilot"]
          end
    caveats: |
      🎉 bash-pilot installed!

      Quick start:
        bash-pilot init                  # Auto-generate config from SSH config
        bash-pilot ssh list              # List SSH hosts with grouping
        bash-pilot ssh ping              # Test connectivity (parallel)
        bash-pilot ssh audit             # Security audit
        bash-pilot git profiles          # List git identity profiles
        bash-pilot git doctor            # Diagnose gitconfig issues
        bash-pilot git clean --dry-run   # Preview stale/duplicate cleanup
        bash-pilot env check             # Shell environment health scan
        bash-pilot env path              # PATH analysis
        bash-pilot prompt init           # Generate smart bash prompt
        bash-pilot prompt show           # Preview prompt components
        bash-pilot snapshot --summary    # Environment snapshot summary
        bash-pilot diff my-env.json      # Compare environments
        bash-pilot setup my-env.json     # Install missing tools
        bash-pilot migrate export        # Export SSH + Git config
        bash-pilot migrate import f.json # Import config on new machine
        bash-pilot doctor                # Full system diagnostics
        bash-pilot --help                # Full usage

      Docs: https://github.com/somaz94/bash-pilot

scoops:
  - repository:
      owner: somaz94
      name: scoop-bucket
    homepage: "https://github.com/somaz94/bash-pilot"
    description: "A powerful CLI toolkit for bash power users — SSH, Git, Env, Prompt"
    license: "Apache-2.0"
